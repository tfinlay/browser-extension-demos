<!DOCTYPE html>
<html lang="en-NZ">
<body>
<h1>Log in</h1>

<form onsubmit="event.preventDefault(); console.log(new FormData(event.target)); event.target.reset();">
    <table>
        <tr>
            <td><label for="username">User name:</label></td>
            <td><input id="username" name="username" type="text" placeholder="Username" /></td>
        </tr>
        <tr>
            <td><label for="password">Password:</label></td>
            <td><input id="password" name="password" type="password" placeholder="Password" /></td>
        </tr>
        <tr>
            <td colspan="2">
                <input type="submit" value="Submit" style="width:100%"/>
            </td>
        </tr>
    </table>
</form>
</body>
</html>
